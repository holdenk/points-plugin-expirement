<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>Points Plugin Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px;
      color: #333;
      background: #f8f9fa;
    }
    h1 { font-size: 24px; margin-bottom: 12px; color: #764ba2; }
    p.notice {
      margin-bottom: 24px;
      font-size: 13px;
      color: #555;
      line-height: 1.4;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input[type="number"], input[type="checkbox"] {
      font-size: 14px;
    }
    input[type="number"] {
      width: 100%;
      max-width: 200px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
      margin: 0;
    }
    .programs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .program-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 10px;
      gap: 16px;
    }
    .valuation-input {
      width: 90px !important;
      text-align: right;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #f0f2ff;
      color: #4254b5;
      border: 1px solid #c9d1ff;
    }
    button:hover { opacity: 0.9; }
    #status {
      margin-top: 12px;
      color: #28a745;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>⚙️ Points Plugin Settings</h1>
  <p class="notice">Affiliate activation must always be user-initiated. This extension does not silently set affiliate cookies.</p>
  <form id="settings-form">
    <div class="form-group">
      <label>
        <span class="checkbox-label">
          <input type="checkbox" id="enable-notifications" />
          Enable popup notifications on shopping pages
        </span>
      </label>
    </div>
    <div class="form-group">
      <label for="min-points">Minimum points threshold</label>
      <input type="number" id="min-points" min="0" max="10000" step="10" />
    </div>
    <div class="form-group">
      <label>Enabled Programs + Point Value (¢)</label>
      <div class="programs-list" id="programs-list"></div>
    </div>
    <div class="actions">
      <button type="button" class="secondary" id="add-program">Add Program</button>
      <button type="submit">Save Settings</button>
    </div>
    <div id="status" role="status">Settings saved!</div>
  </form>
  <script src="options.js"></script>
</body>
</html>
